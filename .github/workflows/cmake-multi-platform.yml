name: CMake Pipeline (FetchContent)

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set build dir
      id: vars
      run: echo "BUILD_DIR=${{ github.workspace }}/build" >> $GITHUB_OUTPUT
      shell: bash

    # 🔧 ONLY system deps (NO SFML here)
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential \
        cmake \
        libx11-dev \
        libxrandr-dev \
        libxcursor-dev \
        libxi-dev \
        libgl1-mesa-dev \
        libudev-dev \
        libfreetype6-dev \
        libopenal-dev \
        libvorbis-dev \
        libflac-dev \
        libmbedtls-dev \
        xvfb \
        libssh2-1-dev

    - name: Install clang
      if: matrix.os == 'ubuntu-latest' && matrix.cpp_compiler == 'clang++'
      run: sudo apt install -y clang

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.cpp_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Configure
      run: >
        cmake -B ${{ steps.vars.outputs.BUILD_DIR }}
        -S ${{ github.workspace }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

    - name: Build
      run: cmake --build ${{ steps.vars.outputs.BUILD_DIR }} --config ${{ matrix.build_type }}

    # 🧪 Headless-safe tests
    - name: Test (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ${{ steps.vars.outputs.BUILD_DIR }}
      run: xvfb-run ctest --build-config ${{ matrix.build_type }}

    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ steps.vars.outputs.BUILD_DIR }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Install (package)
      run: cmake --install ${{ steps.vars.outputs.BUILD_DIR }} --prefix install

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ matrix.cpp_compiler }}-package
        path: install
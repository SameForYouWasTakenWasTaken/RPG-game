name: CMake SFML Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Set build dir
      id: vars
      run: echo "BUILD_DIR=${{ github.workspace }}/build" >> $GITHUB_OUTPUT
      shell: bash
      

    # Optional cache (safe-ish for your use case)
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.cpp_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Configure
      run: >
        cmake -B ${{ steps.vars.outputs.BUILD_DIR }}
        -S ${{ github.workspace }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

    - name: Build
      run: cmake --build ${{ steps.vars.outputs.BUILD_DIR }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.vars.outputs.BUILD_DIR }}
      run: ctest --build-config ${{ matrix.build_type }}

    # 🔥 Proper packaging step
    - name: Install (package)
      run: cmake --install ${{ steps.vars.outputs.BUILD_DIR }} --prefix install

    # 📦 Upload clean runnable build
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-package
        path: install
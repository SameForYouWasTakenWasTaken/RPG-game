name: CMake Pipeline (FetchContent)

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set build dir
      id: vars
      run: echo "BUILD_DIR=${{ github.workspace }}/build" >> $GITHUB_OUTPUT
      shell: bash

    # 🔥 Enable core dumps (Linux)
    - name: Enable core dumps
      if: matrix.os == 'ubuntu-latest'
      run: |
        ulimit -c unlimited
        echo "/tmp/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern

    # 🔧 ONLY system deps
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential \
        cmake \
        gdb \
        libx11-dev \
        libxrandr-dev \
        libxcursor-dev \
        libxi-dev \
        libgl1-mesa-dev \
        libudev-dev \
        libfreetype6-dev \
        libopenal-dev \
        libvorbis-dev \
        libflac-dev \
        libmbedtls-dev \
        xvfb \
        libssh2-1-dev \
        libharfbuzz-dev

    - name: Install clang
      if: matrix.os == 'ubuntu-latest' && matrix.cpp_compiler == 'clang++'
      run: sudo apt install -y clang

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-${{ matrix.cpp_compiler }}-${{ hashFiles('**/CMakeLists.txt') }}

    # 🔥 Configure with debug symbols + sanitizers (Linux only)
    - name: Configure
      run: >
        cmake -B ${{ steps.vars.outputs.BUILD_DIR }}
        -S ${{ github.workspace }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        ${{ matrix.os == 'ubuntu-latest' && '-DCMAKE_CXX_FLAGS="-O2 -g -fsanitize=address,undefined"' || '' }}

    - name: Build
      run: cmake --build ${{ steps.vars.outputs.BUILD_DIR }} --config ${{ matrix.build_type }}

    # 🧪 Tests with sanitizer output
    - name: Test (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ${{ steps.vars.outputs.BUILD_DIR }}
      run: |
        export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
        xvfb-run ctest --output-on-failure --build-config ${{ matrix.build_type }}

    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ steps.vars.outputs.BUILD_DIR }}
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

    # 🔥 Collect core dumps if crash happened
    - name: Collect core dumps
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p core_dumps
        cp /tmp/core.* core_dumps/ || true

    # 🔥 Upload debug artifacts
    - name: Upload debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-${{ runner.os }}-${{ matrix.cpp_compiler }}
        path: |
          build
          core_dumps

    - name: Install (package)
      run: cmake --install ${{ steps.vars.outputs.BUILD_DIR }} --prefix install

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-${{ matrix.cpp_compiler }}-package
        path: install